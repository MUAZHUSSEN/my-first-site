    <h3>ስለ እኔ የሚገልጽ ታሪክ</h3>
    <p style="font-size: 18px;">ኮዲንግ መማር ስጀምር በጣም ደስ ብሎኛል፤ አሁን ደግሞ የራሴን ፎቶ እና ረጅም ጽሁፍ በዌብሳይቴ ላይ ማካተት ችያለሁ!</p>
    <p style="font-size: 18px;">ይህንን ዌብሳይት የሰራሁት በ Termux እና በ HTML በመጠቀም ነው። ወደፊትም ብዙ አሪፍ ነገሮችን እሰራበታለሁ።</p>
    <p style="font-size: 18px;">ጓደኞቼም ይህንን ዌብሳይት ሲያዩት በጣም ተገርመዋል እንዲሁም ደስ ብሎታል። 🚀</p>
